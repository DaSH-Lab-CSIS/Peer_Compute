global
  maxconn 4096

defaults
    mode                tcp
    retries             2
    timeout connect     5s
    timeout client      10m
    timeout server      10m
    option              clitcpka

listen psql
    bind 127.0.0.1:26257
    mode tcp
    balance roundrobin
    option httpchk GET /health?ready=1
    server cockroach1 anjuna2.dashlab.in:26257 check port 18080
    server cockroach2 colva3.dashlab.in:26257 check port 18080
    server cockroach3 colva2.dashlab.in:26257 check port 18080
