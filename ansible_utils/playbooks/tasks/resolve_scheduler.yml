---
# Sets scheduler_host and scheduler_url from the first [control] host that accepts TCP 8000.
# Requires groups['control'] and hostvars[item].ansible_host (or inventory hostname).
- name: Probe control nodes for scheduler API (inventory order, first success wins)
  wait_for:
    host: "{{ hostvars[item].get('ansible_host', item) }}"
    port: 8000
    timeout: "{{ scheduler_probe_timeout | default(120) | int }}"
  loop: "{{ groups['control'] }}"
  loop_control:
    label: "{{ item }}"
  register: scheduler_probe
  ignore_errors: true

- name: Fail if no control node accepts scheduler connections
  fail:
    msg: >-
      No control host in groups['control'] accepted TCP 8000 within
      {{ scheduler_probe_timeout | default(120) }}s per host.
      Tried: {{ groups['control'] | join(', ') }}
  when: scheduler_probe.results | selectattr('failed', 'equalto', false) | list | length == 0

- name: Set scheduler_host and scheduler_url from first reachable control node
  set_fact:
    scheduler_host: "{{ hostvars[_sched_inv].get('ansible_host', _sched_inv) }}"
    scheduler_url: "http://{{ hostvars[_sched_inv].get('ansible_host', _sched_inv) }}:8000"
  vars:
    _sched_inv: "{{ (scheduler_probe.results | selectattr('failed', 'equalto', false) | list | first).item }}"
