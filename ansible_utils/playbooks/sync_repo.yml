---
- name: Sync repository on all nodes
  hosts: control:managed
  become: yes
  vars_files:
    - secrets.yml
  vars:
    # Override these with -e to test a personal fork/branch without going through
    # the push -> PR -> sync-to-aalhad chain. Defaults match production (aalhad/main).
    #   ansible-playbook sync_repo.yml -e "repo_owner=sn34kyp3t3 repo_branch=my-feature"
    # If the target fork is private and needs a different token, also pass:
    #   -e "github_pat=<token-with-access-to-that-fork>"
    repo_owner: "aalhadsawane"
    repo_branch: "main"
    repo_url: "https://{{ github_pat }}@github.com/{{ repo_owner }}/Serverless_Scheduler"
    project_dir: "/home/{{ ansible_user }}/deploy/Serverless_Scheduler"
  tasks:
    - name: Bootstrap python3-apt
      raw: apt-get update && apt-get install -y python3-apt
      changed_when: false

    - name: Ensure git is installed
      apt:
        name: git
        state: present
        update_cache: yes

    - name: Ensure deployment directory exists
      file:
        path: "{{ project_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Sync repository to latest {{ repo_owner }}/{{ repo_branch }}
      git:
        repo: "{{ repo_url }}"
        dest: "{{ project_dir }}"
        version: "{{ repo_branch }}"
        force: yes
