---
- name: Sync repository on all nodes
  hosts: control:managed
  become: yes
  vars_files:
    - secrets.yml
  vars:
    # code_sync_method:
    #   git (default) — nodes clone {{ repo_owner }}/{{ repo_branch }} from GitHub.
    #   rsync         — push this machine's tracked files over SSH; no GitHub access
    #                   needed. See tasks/push_code.yml for exactly what ships.
    # Git mode: defaults to DaSH-Lab-CSIS/Peer_Compute @ main. Override with -e to
    # test a fork/branch:
    #   -e "repo_owner=<owner> repo_name=<repo> repo_branch=my-feature"
    # If the target fork is private and needs a different token, also pass:
    #   -e "github_pat=<token-with-access-to-that-fork>"
    code_sync_method: "git"
    repo_owner: "DaSH-Lab-CSIS"
    repo_name: "Peer_Compute"
    repo_branch: "main"
    repo_url: "https://{{ github_pat }}@github.com/{{ repo_owner }}/{{ repo_name }}"
    project_dir: "/home/{{ ansible_user }}/deploy/Serverless_Scheduler"
  tasks:
    # Only touch apt when something is missing: a stuck unattended-upgrades /
    # apt-daily run holds the apt lock and would otherwise block every code sync.
    - name: Bootstrap python3-apt (only if missing)
      raw: dpkg -s python3-apt >/dev/null 2>&1 || (apt-get update && apt-get install -y python3-apt)
      changed_when: false

    # The apt module takes the apt lock even when packages are already present,
    # so probe for the binaries first and only call apt if one is missing.
    - name: Check for git and rsync
      shell: command -v git && command -v rsync
      register: sync_tools
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Install git and rsync (only if missing)
      apt:
        name: [git, rsync]
        state: present
        cache_valid_time: 86400
        lock_timeout: 300
      when: sync_tools.rc != 0

    - name: Push code from controller (rsync)
      include_tasks: "{{ playbook_dir }}/tasks/push_code.yml"
      when: code_sync_method == "rsync"

    - name: Ensure deployment directory exists
      file:
        path: "{{ project_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"
      when: code_sync_method == "git"

    - name: Hand root-owned files back to the node user (git runs unprivileged)
      include_tasks: "{{ playbook_dir }}/tasks/fix_ownership.yml"
      when: code_sync_method == "git"

    - name: Sync repository to latest {{ repo_owner }}/{{ repo_branch }}
      git:
        repo: "{{ repo_url }}"
        dest: "{{ project_dir }}"
        version: "{{ repo_branch }}"
        force: yes
      when: code_sync_method == "git"
      become_user: "{{ ansible_user }}"
      no_log: true   # repo_url carries the PAT; -vvv would write it to the log
