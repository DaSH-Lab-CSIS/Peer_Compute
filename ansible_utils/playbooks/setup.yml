---
- name: Setup Control Node
  hosts: control
  become: yes
  tags: setup
  vars_files:
    - secrets.yml 
  vars:
    repo_url: "https://{{ github_pat }}@github.com/aalhadsawane/Serverless_Scheduler"
    project_dir: "/home/{{ ansible_user }}/deploy/Serverless_Scheduler"
    miniforge_path: "/home/{{ ansible_user }}/miniforge3"
    venv_python: "{{ project_dir }}/.venv/bin/python"
    cockroach_client_certs_source_dir: "{{ project_dir }}/certs"
    cockroach_client_certs_dest_dir: "/etc/cockroach/certs"
  tasks:
    # NOTE: this is commented as it was old way of connecting to wifi.
    # - name: Give execute permission to login.sh
    #   file:
    #     path: /home/{{ ansible_user }}/wifi_login/login.sh
    #     mode: '0755'
    # - name: Run WiFi login script
    #   command: ./login.sh
    #   args:
    #     chdir: /home/{{ ansible_user }}/wifi_login
    #   become: false
    - name: Bootstrap python3-apt
      raw: sudo apt-get update && sudo apt-get install -y python3-apt
      changed_when: false
    - name: Install dependencies
      apt:
        name:
          - git
          - python3-pip
          - python3-venv
          - python3-packaging
          - curl
          - jq
        state: present
        update_cache: yes
    - name: Ensuring deployment directory exists
      file:
        path: "{{ project_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Clone repository
      tags: git_clone_control
      git:
        repo: "{{ repo_url }}"
        dest: "{{ project_dir }}"
        version: main
        force: yes

    - name: Remove broken venv (control node)
      file:
        path: "{{ project_dir }}/.venv"
        state: absent


    - name: Check if Miniforge is installed (control node)
      tags: debug
      stat:
        path: "{{ miniforge_path }}/bin/conda"
      register: miniforge_installed_control
    - name: Download Miniforge installer (control node)
      tags: debug
      get_url:
        url: "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-{{ ansible_system }}-{{ ansible_machine }}.sh"
        dest: "/tmp/Miniforge3-{{ ansible_system }}-{{ ansible_machine }}.sh"
        mode: "0755"
      when: not miniforge_installed_control.stat.exists
    - name: Install Miniforge (control node)
      tags: debug
      command: bash /tmp/Miniforge3-{{ ansible_system }}-{{ ansible_machine }}.sh -b -p {{ miniforge_path }}
      become_user: "{{ ansible_user }}"
      when: not miniforge_installed_control.stat.exists
    - name: Create virtualenv with conda (control node)
      tags: debug
      command: "{{ miniforge_path }}/bin/conda create -p {{ project_dir }}/.venv python=3.13 -y"
      args:
        creates: "{{ project_dir }}/.venv/bin/python"
      become_user: "{{ ansible_user }}"
    - name: Install numpy, scipy, pandas, pillow via conda (control node)
      tags: debug
      command: "{{ miniforge_path }}/bin/conda install -p {{ project_dir }}/.venv numpy scipy pandas pillow -y"
      become_user: "{{ ansible_user }}"
    - name: Install Python requirements (control node)
      tags: debug
      command: "{{ project_dir }}/.venv/bin/pip install -r {{ project_dir }}/requirements.txt --no-input --index-url https://pypi.org/simple"
      become_user: "{{ ansible_user }}"
      async: 1200
      poll: 15

    - name: Install provider pip requirements (control node)
      tags: debug
      command: "{{ project_dir }}/.venv/bin/pip install -r {{ project_dir }}/provider/requirements.txt --no-input --index-url https://pypi.org/simple"
      become_user: "{{ ansible_user }}"
      async: 1200
      poll: 15

    - name: Install psycopg2-binary (venv)
      tags: [debug, debug-django]
      command: "{{ project_dir }}/.venv/bin/pip install psycopg2-binary --no-input --index-url https://pypi.org/simple"
      become_user: "{{ ansible_user }}"

    - name: Install loadbalancer pip requirements (control node)
      tags: [debug, debug-django]
      command: "{{ project_dir }}/.venv/bin/pip install -r {{ project_dir }}/loadbalancer/requirements.txt --no-input --index-url https://pypi.org/simple"
      become_user: "{{ ansible_user }}"

    - name: Kill any existing Django server
      tags: [debug, debug-django]
      shell: pkill -f "[m]anage.py runserver" || true
      args:
        executable: /bin/bash

    - name: Ensure CockroachDB client cert directory exists on scheduler host
      tags: [debug, debug-django, cockroach]
      file:
        path: "{{ cockroach_client_certs_dest_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Check CockroachDB client cert files on source path
      tags: [debug, debug-django, cockroach]
      stat:
        path: "{{ cockroach_client_certs_source_dir }}/{{ item }}"
      loop:
        - ca.crt
        - client.root.crt
        - client.root.key
      register: cockroach_cert_stats

    - name: Copy CockroachDB client cert files for Django TLS
      tags: [debug, debug-django, cockroach]
      copy:
        src: "{{ item.stat.path }}"
        dest: "{{ cockroach_client_certs_dest_dir }}/{{ item.stat.path | basename }}"
        owner: root
        group: root
        mode: "{{ '0600' if (item.stat.path | basename) == 'client.root.key' else '0644' }}"
        remote_src: true
      loop: "{{ cockroach_cert_stats.results }}"
      when: item.stat.exists

    - name: Fail if CockroachDB client cert files are missing
      tags: [debug, debug-django, cockroach]
      assert:
        that:
          - item.stat.exists
        fail_msg: "Missing {{ item.item }} at {{ cockroach_client_certs_source_dir }}. Refusing to start Django with CockroachDB TLS."
      loop: "{{ cockroach_cert_stats.results }}"


    - name: Start Django server
      tags: [debug, debug-django]
      become_user: "{{ ansible_user }}"
      shell: |
        nohup {{ venv_python }} manage.py runserver 0.0.0.0:8000 \
        > django.log 2>&1 &
      args:
        chdir: "{{ project_dir }}/scheduler"
        executable: /bin/bash
      async: 30
      poll: 0

    - name: Validate venv python runtime can import encodings
      tags: [debug, debug-django]
      become_user: "{{ ansible_user }}"
      command:
        argv:
          - "{{ venv_python }}"
          - "-c"
          - "import encodings; print('ok')"


    - name: Wait for Django to start
      tags: [debug, debug-django]
      block:
        - name: Wait for Django port 8000
          wait_for:
            host: 127.0.0.1
            port: 8000
            delay: 2
            timeout: 30
      rescue:
        - name: Show recent Django log lines after failed startup
          shell: |
            if [ -f "{{ project_dir }}/scheduler/django.log" ]; then
              echo "===== django.log (last 120 lines) ====="
              sed -n '1,120p' "{{ project_dir }}/scheduler/django.log"
              echo "===== end django.log ====="
            else
              echo "django.log not found at {{ project_dir }}/scheduler/django.log"
            fi
          args:
            executable: /bin/bash
          register: django_startup_log
          changed_when: false

        - name: Print Django startup diagnostics
          debug:
            msg: "{{ django_startup_log.stdout }}"

        - name: Fail setup due to Django startup timeout
          fail:
            msg: "Django did not start on 127.0.0.1:8000. See diagnostics above."

# Separate play so --start-at-task on any task in "Setup Managed Nodes" still runs a full git sync
# first (Ansible only skips tasks before the match within the play that contains that task).
- name: Setup Managed Nodes - sync git workspace
  hosts: managed
  become: yes
  tags:
    - setup
    - managed_git_sync
  vars_files:
    - secrets.yml
  vars:
    repo_url: "https://{{ github_pat }}@github.com/aalhadsawane/Serverless_Scheduler"
    project_dir: "/home/{{ ansible_user }}/deploy/Serverless_Scheduler"
  tasks:
    # NOTE: this is commented as it is obsolete wifi connection code
    # - name: Give execute permission to login.sh
    #   file:
    #     path: /home/{{ ansible_user }}/wifi_login/login.sh
    #     mode: '0755'
    # - name: Run WiFi login script
    #   shell: bash -lc "./login.sh"
    #   args:
    #     chdir: /home/{{ ansible_user }}/wifi_login
    #   become: false
    - name: Bootstrap python3-apt
      raw: apt-get update && apt-get install -y python3-apt
      changed_when: false
    - name: Install dependencies (git and base packages for clone)
      apt:
        name:
          - git
          - python3-pip
          - python3-venv
          - python3-packaging
          - curl
          - jq
        state: present
        update_cache: yes
    - name: Ensure deployment directory exists
      file:
        path: "{{ project_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"
    - name: Clone repository on managed nodes
      git:
        repo: "{{ repo_url }}"
        dest: "{{ project_dir }}"
        version: main
        force: yes

- name: Setup Managed Nodes
  hosts: managed
  become: yes
  tags: setup
  vars_files:
    - secrets.yml
  vars:
    repo_url: "https://{{ github_pat }}@github.com/parasmittal099/Serverless_Scheduler"
    project_dir: "/home/{{ ansible_user }}/deploy/Serverless_Scheduler"
    miniforge_path: "/home/{{ ansible_user }}/miniforge3"
    # scheduler_host / scheduler_url: from -e, or discovered via tasks/resolve_scheduler.yml
    scheduler_probe_timeout: 120
    service_ids: [3, 12, 13, 17, 18, 19, 20, 21, 22, 23, 24]
    user_id_file: "{{ project_dir }}/provider_user_id.txt"
  tasks:
    - name: Remove broken venv
      file:
        path: "{{ project_dir }}/.venv"
        state: absent
    - name: Check if Miniforge is installed
      stat:
        path: "{{ miniforge_path }}/bin/conda"
      register: miniforge_installed
    - name: Download Miniforge installer
      get_url:
        url: "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-{{ ansible_system }}-{{ ansible_machine }}.sh"
        dest: "/tmp/Miniforge3-{{ ansible_system }}-{{ ansible_machine }}.sh"
        mode: "0755"
      when: not miniforge_installed.stat.exists
    - name: Install Miniforge
      command: bash /tmp/Miniforge3-{{ ansible_system }}-{{ ansible_machine }}.sh -b -p {{ miniforge_path }}
      become_user: "{{ ansible_user }}"
      when: not miniforge_installed.stat.exists
    - name: Create virtualenv with conda (managed node)
      command: "{{ miniforge_path }}/bin/conda create -p {{ project_dir }}/.venv python=3.13 -y"
      args:
        creates: "{{ project_dir }}/.venv/bin/python"
      become_user: "{{ ansible_user }}"
    - name: Install numpy, scipy, pandas, pillow via conda (avoids long/broken pip build on aarch64)
      command: "{{ miniforge_path }}/bin/conda install -p {{ project_dir }}/.venv numpy scipy pandas pillow -y"
      become_user: "{{ ansible_user }}"
    - name: Install Python requirements
      command: "{{ project_dir }}/.venv/bin/pip install -r {{ project_dir }}/requirements.txt --no-input --index-url https://pypi.org/simple"
      become_user: "{{ ansible_user }}"
      async: 1200
      poll: 15

    - name: Ensure Docker is running
      tags: debug
      service:
        name: docker
        state: started
        enabled: yes

    - name: Default scheduler_url from scheduler_host (-e override)
      tags: debug
      set_fact:
        scheduler_url: "http://{{ scheduler_host }}:8000"
      when: scheduler_host is defined and scheduler_url is not defined

    - name: Discover scheduler on control group (try each [control] host in order)
      tags: debug
      include_tasks: tasks/resolve_scheduler.yml
      when: scheduler_host is not defined and scheduler_url is not defined

    - name: Install boto3 on managed node
      command: "{{ project_dir }}/.venv/bin/pip install boto3 --no-input --index-url https://pypi.org/simple"
      become_user: "{{ ansible_user }}"

    - name: Check for existing User ID
      stat:
        path: "{{ user_id_file }}"
      register: user_id_stat

    - name: Register Provider (if not already registered)
      uri:
        url: "{{ scheduler_url }}/profiles/register_user/"
        method: POST
        body_format: json
        body:
          is_provider: true
          is_developer: false
          active: true
          ready: true
          location: "{{ ansible_hostname }}"
          ram: 16
          cpu: 8
        return_content: yes
      register: registration_response
      when: not user_id_stat.stat.exists

    - name: Save User ID to file
      copy:
        content: "{{ registration_response.json.user_id }}"
        dest: "{{ user_id_file }}"
      when: not user_id_stat.stat.exists

    - name: Read User ID from file
      slurp:
        src: "{{ user_id_file }}"
      register: slurp_user_id

    - name: Set User ID fact
      set_fact:
        provider_user_id: "{{ slurp_user_id.content | b64decode | trim }}"

    - name: Calculate Efficiency
      uri:
        url: "{{ scheduler_url }}/providers/calculate_efficiency/{{ provider_user_id }}"
        method: GET
      when: not user_id_stat.stat.exists  # Only calculate efficiency on first registration

    - name: Ensure MQTT settings in project .env
      blockinfile:
        path: "{{ project_dir }}/.env"
        marker: "# {mark} ANSIBLE MANAGED MQTT"
        block: |
          export MQTT_BROKER=utorda2.dashlab.in
          export MQTT_PORT=1884
          export MQTT_USERNAME=peercompute
          export MQTT_PASSWORD=peercompute
        create: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
      become_user: "{{ ansible_user }}"

    # Same effect as: sudo usermod -aG docker $USER
    # New SSH sessions get the docker group automatically. For an already-open shell without
    # logging out, run: newgrp docker (Ansible cannot attach that to your interactive session.)
    - name: Grant ansible user access to Docker socket
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Install provider pip requirements
      command: "{{ project_dir }}/.venv/bin/pip install -r {{ project_dir }}/provider/requirements.txt --no-input --index-url https://pypi.org/simple"
      become_user: "{{ ansible_user }}"

    - name: Check if Provider Script is running
      shell: "pgrep -f 'provider1.py' || true"
      register: provider_process

    - name: Start Provider Script
      shell: |
        nohup {{ project_dir }}/.venv/bin/python {{ project_dir }}/provider/provider1.py {{ provider_user_id }} > {{ project_dir }}/provider.log 2>&1 &
      args:
        executable: /bin/bash
      async: 10
      poll: 0
      when: provider_process.stdout == ""
