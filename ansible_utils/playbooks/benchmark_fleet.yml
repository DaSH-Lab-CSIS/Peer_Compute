---
# benchmark_fleet.yml
#
# Runs machine and function benchmarks across the fleet and ingests results
# into the scheduler DB so the prediction engine has real data.
#
# Usage:
#   cd ansible_utils
#   ./run_playbook.sh playbooks/benchmark_fleet.yml -vvv --ask-vault-pass
#
# Optional overrides:
#   -e "bem_host=cortalim1.dashlab.in"  # which managed node is the BEM (default: utorda1)
#   -e "skip_dims=net"                  # skip network throttle (if not root)
#   -e "bench_probes=cpu,mem"           # run only a subset of machine probes; the
#                                       # results are merged into benchmark_results/
#                                       # so unmeasured probes keep their stored values
#   -e "bench_services=010,020,040,504" # function-benchmark only these numbers
#   --tags machine | function | ingest  # run only some plays
#
# What this does:
#   Play 1 — Run machine benchmark on every reachable managed node.
#             Reads provider_user_id.txt to identify each node.
#             Produces machine_bench_<hostname>.json in /tmp on each node.
#             Fetches all JSONs back to ansible_utils/benchmark_results/ on localhost.
#   Play 2 — Run machine benchmark on control nodes (schedulers) too,
#             so their r_i ratios can be computed relative to BEM.
#   Play 3 — Run function (service) benchmark on the BEM node (utorda1 by default).
#             Requires docker on the BEM. Uses sudo for network throttle.
#             Produces function_bench.json. Fetches back to localhost.
#   Play 4 — Ingest all benchmark JSONs into the scheduler DB via manage.py.

- name: Machine benchmarks on provider nodes
  tags: [machine]
  hosts: managed
  gather_facts: false
  ignore_unreachable: true
  vars:
    project_dir: "/home/{{ ansible_user }}/deploy/Serverless_Scheduler"
    user_id_file: "{{ project_dir }}/provider_user_id.txt"
    bench_out: "/tmp/machine_bench_{{ inventory_hostname }}.json"
    bench_probes: "cpu,mem,disk,net"
    local_bench_dir: "{{ playbook_dir }}/../../ansible_utils/benchmark_results"

  tasks:
    - name: Check provider_user_id.txt exists
      stat:
        path: "{{ user_id_file }}"
      register: uid_stat

    - name: Skip host if provider_user_id.txt missing or host unreachable
      meta: end_host
      when: uid_stat.stat is not defined or not uid_stat.stat.exists

    - name: Read provider_user_id
      slurp:
        src: "{{ user_id_file }}"
      register: slurp_uid

    - name: Set provider_id fact
      set_fact:
        provider_id: "{{ slurp_uid.content | b64decode | trim }}"

    - name: Run machine benchmark
      shell: >-
        {{ project_dir }}/.venv/bin/python
        {{ project_dir }}/scripts/benchmarks/benchmark.py
        provider
        --provider-id {{ provider_id }}
        --probes {{ bench_probes }}
        --out {{ bench_out }}
      args:
        executable: /bin/bash
      register: machine_bench_result
      timeout: 900
      failed_when: machine_bench_result.rc != 0

    - name: Fetch machine benchmark JSON to localhost
      fetch:
        src: "{{ bench_out }}"
        dest: "{{ local_bench_dir }}/incoming/machine_bench_{{ inventory_hostname }}.json"
        flat: true
      register: machine_bench_fetch
      failed_when: false

    # Merge only the probes that ran, so a partial run (-e bench_probes=net)
    # keeps the stored cpu/mem/disk scores. Ingest reads only the top-level dir.
    - name: Merge measured probes into benchmark_results
      command: >-
        python3 {{ playbook_dir }}/../../scripts/benchmarks/merge_machine_bench.py
        {{ local_bench_dir }}/incoming/machine_bench_{{ inventory_hostname }}.json
        {{ local_bench_dir }}/machine_bench_{{ inventory_hostname }}.json
        --probes {{ bench_probes }}
      delegate_to: localhost
      become: false
      when: machine_bench_fetch.checksum is defined   # fetch succeeded

# ---------------------------------------------------------------------------

- name: Machine benchmarks on control (scheduler) nodes
  tags: [machine]
  hosts: control
  gather_facts: false
  ignore_unreachable: true
  vars:
    project_dir: "/home/{{ ansible_user }}/deploy/Serverless_Scheduler"
    user_id_file: "{{ project_dir }}/provider_user_id.txt"
    bench_out: "/tmp/machine_bench_{{ inventory_hostname }}.json"
    bench_probes: "cpu,mem,disk,net"
    local_bench_dir: "{{ playbook_dir }}/../../ansible_utils/benchmark_results"
    # The BEM is a scheduler, not a provider, so it has no provider_user_id.txt.
    # Its machine benchmark is the r_i denominator and is keyed by this id.
    bem_host: "utorda1.dashlab.in"
    bem_machine_id: "11111111-1111-1111-1111-111111111111"

  tasks:
    - name: Check provider_user_id.txt exists on control node
      stat:
        path: "{{ user_id_file }}"
      register: uid_stat

    - name: Skip control node if it is not the BEM and has no provider_user_id.txt
      meta: end_host
      when:
        - inventory_hostname != bem_host
        - uid_stat.stat is not defined or not uid_stat.stat.exists

    - name: Read provider_user_id from control node
      slurp:
        src: "{{ user_id_file }}"
      register: slurp_uid
      when: uid_stat.stat.exists

    - name: Set provider_id fact
      set_fact:
        provider_id: >-
          {{ (slurp_uid.content | b64decode | trim) if uid_stat.stat.exists else bem_machine_id }}

    - name: Run machine benchmark on control node
      shell: >-
        {{ project_dir }}/.venv/bin/python
        {{ project_dir }}/scripts/benchmarks/benchmark.py
        provider
        --provider-id {{ provider_id }}
        --probes {{ bench_probes }}
        --out {{ bench_out }}
      args:
        executable: /bin/bash
      register: machine_bench_result
      timeout: 900
      failed_when: machine_bench_result.rc != 0

    - name: Fetch control node machine benchmark JSON to localhost
      fetch:
        src: "{{ bench_out }}"
        dest: "{{ local_bench_dir }}/incoming/machine_bench_{{ inventory_hostname }}.json"
        flat: true
      register: machine_bench_fetch
      failed_when: false

    # Merge only the probes that ran, so a partial run (-e bench_probes=net)
    # keeps the stored cpu/mem/disk scores. Ingest reads only the top-level dir.
    - name: Merge measured probes into benchmark_results
      command: >-
        python3 {{ playbook_dir }}/../../scripts/benchmarks/merge_machine_bench.py
        {{ local_bench_dir }}/incoming/machine_bench_{{ inventory_hostname }}.json
        {{ local_bench_dir }}/machine_bench_{{ inventory_hostname }}.json
        --probes {{ bench_probes }}
      delegate_to: localhost
      become: false
      when: machine_bench_fetch.checksum is defined   # fetch succeeded

# ---------------------------------------------------------------------------

- name: Function (service) benchmark on BEM node
  tags: [function]
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    # BEM host to run the function benchmark on.
    # utorda1 does not have provider_user_id.txt — override with a cortalim node
    # that has the file, e.g.: -e "bem_host=cortalim2.dashlab.in"
    bem_host: "utorda1.dashlab.in"
    local_project_dir: "/home/peercompute/Serverless_Scheduler"
    bem_project_dir: "/home/{{ hostvars[bem_host]['ansible_user'] | default('peercompute') }}/deploy/Serverless_Scheduler"
    bem_uid_file: "{{ bem_project_dir }}/provider_user_id.txt"
    function_bench_out: "/tmp/function_bench.json"
    local_bench_dir: "{{ playbook_dir }}/../../ansible_utils/benchmark_results"
    # Comma-separated dims to skip (e.g. "net" if no root access for tc)
    skip_dims: ""
    # Comma-separated benchmark numbers (empty = all in reference_images.SERVICES)
    bench_services: ""
    # Override with -e "bem_provider_id=<uuid>" to skip reading the file.
    bem_provider_id: ""
    # Used when the BEM has no provider_user_id.txt (utorda1 is a scheduler,
    # not a provider). Must match the id in its machine_bench JSON.
    bem_machine_id: "11111111-1111-1111-1111-111111111111"

  tasks:
    - name: Ensure local benchmark_results directory exists
      file:
        path: "{{ local_bench_dir }}"
        state: directory
        mode: "0755"

    - name: Check provider_user_id.txt exists on BEM
      stat:
        path: "{{ bem_uid_file }}"
      register: bem_uid_stat
      delegate_to: "{{ bem_host }}"
      when: bem_provider_id == ""

    - name: Read BEM provider_user_id from file
      slurp:
        src: "{{ bem_uid_file }}"
      register: bem_uid_slurp
      delegate_to: "{{ bem_host }}"
      when: bem_provider_id == "" and bem_uid_stat.stat.exists

    - name: Set bem_provider_id fact (file, else the fixed BEM id)
      set_fact:
        bem_provider_id: >-
          {{ (bem_uid_slurp.content | b64decode | trim) if bem_uid_stat.stat.exists else bem_machine_id }}
      when: bem_provider_id == ""

    - name: Run function benchmark on BEM (all 12 services take ~1.5-2 h)
      shell: >-
        {{ bem_project_dir }}/.venv/bin/python
        {{ bem_project_dir }}/scripts/benchmarks/benchmark.py
        service
        --provider-id {{ bem_provider_id }}
        --out {{ function_bench_out }}
        --B {{ bench_B | default(3) }}
        --B-prime {{ bench_B_prime | default(1) }}
        {% if bench_services | length > 0 %}--services {{ bench_services }}{% endif %}
        {% if skip_dims | length > 0 %}--skip-dims {{ skip_dims }}{% endif %}
      args:
        executable: /bin/bash
      register: function_bench_result
      timeout: 21600
      failed_when: function_bench_result.rc != 0
      delegate_to: "{{ bem_host }}"
      # Root is required: without it benchmark.py silently skips the network
      # throttle and every service gets w_net = 0.
      become: true

    - name: Fetch function benchmark JSON to localhost
      fetch:
        src: "{{ function_bench_out }}"
        dest: "{{ local_bench_dir }}/incoming/function_bench.json"
        flat: true
      delegate_to: "{{ bem_host }}"

    # A --services run only contains those images; merge per service so the
    # stored function_bench.json keeps every other service.
    - name: Merge function benchmark into benchmark_results
      command: >-
        python3 {{ playbook_dir }}/../../scripts/benchmarks/merge_function_bench.py
        {{ local_bench_dir }}/incoming/function_bench.json
        {{ local_bench_dir }}/function_bench.json
      become: false

    - name: Show function benchmark output summary
      debug:
        msg: "{{ function_bench_result.stdout_lines[-20:] }}"
      when: function_bench_result.stdout_lines is defined

# ---------------------------------------------------------------------------

- name: Ingest benchmark results into scheduler DB
  tags: [ingest]
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    local_project_dir: "/home/peercompute/Serverless_Scheduler"
    local_bench_dir: "{{ playbook_dir }}/../../ansible_utils/benchmark_results"
    # The BEM is the reference machine; its machine_bench JSON is the denominator
    # for r_i(m) = S_i(BEM) / S_i(m).  Must match bem_host from Play 3.
    bem_host: "utorda1.dashlab.in"
    # Override with -e "bem_provider_id=<uuid>" when the BEM has no machine bench JSON
    # (e.g. utorda1 is a control node, not a provider node).
    bem_provider_id: ""

  tasks:
    - name: List fetched machine benchmark files
      find:
        paths: "{{ local_bench_dir }}"
        patterns: "machine_bench_*.json"
      register: machine_bench_files

    - name: Check function benchmark file exists
      stat:
        path: "{{ local_bench_dir }}/function_bench.json"
      register: func_bench_stat

    - name: Read BEM provider_id from its machine bench JSON
      shell: >-
        python3 -c "import json; d=json.load(open('{{ local_bench_dir }}/machine_bench_{{ bem_host }}.json')); print(d['provider_id'])"
      register: bem_provider_id_read
      changed_when: false
      when: bem_provider_id == ""

    - name: Set bem_provider_id for ingestion
      set_fact:
        bem_provider_id: "{{ bem_provider_id_read.stdout | trim }}"
      when: bem_provider_id == ""

    - name: Ingest machine + function benchmarks into DB
      shell: >-
        {{ local_project_dir }}/.venv/bin/python
        {{ local_project_dir }}/scheduler/manage.py
        ingest_benchmarks
        --machine-dir {{ local_bench_dir }}
        --bem-provider-id {{ bem_provider_id }}
        {% if func_bench_stat.stat.exists %}--function-file {{ local_bench_dir }}/function_bench.json{% endif %}
      args:
        chdir: "{{ local_project_dir }}/scheduler"
        executable: /bin/bash
      register: ingest_result
      environment:
        DJANGO_SETTINGS_MODULE: scheduler.settings

    - name: Show ingest result
      debug:
        msg: "{{ ingest_result.stdout_lines }}"

    - name: Warn if ingest had errors
      debug:
        msg: "INGEST STDERR: {{ ingest_result.stderr_lines }}"
      when: ingest_result.stderr_lines | length > 0
